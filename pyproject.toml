[project]
name = "saad-sales-gpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ankita Aparajita Swain", email = "amlantripathy124@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=1.2.0",
    "apify-client>=3.1.3",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
saad-gpt = "saad_sales_gpt.cli:app"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends(...) as a default arg is the standard FastAPI pattern

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["I001", "UP007", "UP035"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
